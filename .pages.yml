# Configuration de l'éditeur Pages CMS (https://pagescms.org)
# Elle définit les formulaires que tu remplis pour écrire et modifier le site.

media:
  input: assets/images
  output: /assets/images
  rename: safe
  categories: [image]

content:
  - name: breves
    label: Brèves
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, adversaire, published]
      sort: date
      order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: published
        label: "Publiée (décoche pour garder un brouillon)"
        type: boolean
        default: true
      - name: date
        label: Date du match
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: competition
        label: Compétition
        type: select
        required: true
        options:
          values: [Ligue 1, Ligue des champions, Coupe de France, Trophée des champions, Match amical]
      - name: journee
        label: Journée ou tour
        type: string
        description: "Ex. : 10e journée, 8e de finale aller…"
      - name: adversaire
        label: Adversaire
        type: string
        required: true
      - name: domicile
        label: Match au Parc (à domicile)
        type: boolean
        default: true
      - name: buts_psg
        label: Buts du PSG
        type: number
        required: true
      - name: buts_adversaire
        label: Buts de l'adversaire
        type: number
        required: true
      - name: buteurs
        label: Buteurs
        type: string
        description: "Ex. : Illia Zabarnyi (39e). Laisse vide en cas de 0-0."
      - name: stade
        label: Stade
        type: string
        default: Parc des Princes
      - name: chapeau
        label: Chapeau
        type: text
        description: "Une ou deux phrases d'accroche, affichées sous le titre."
      - name: photo
        label: Photo principale
        type: image
        description: "Une de tes photos, ou une photo dont l'auteur t'a donné l'accord."
      - name: legende
        label: Légende de la photo
        type: string
        description: "Sert aussi de description pour les personnes malvoyantes : dis ce qu'on voit."
      - name: note_tribune
        label: Note de la tribune (sur 10)
        type: number
      - name: note_terrain
        label: Note du terrain (sur 10)
        type: number
      - name: homme_du_soir
        label: L'homme du soir
        type: string
      - name: body
        label: Texte de la brève
        type: rich-text
        description: "Le bouton citation met une phrase en exergue, en grandes capitales."

  - name: reglages
    label: Réglages du site
    type: file
    path: _data/reglages.yml
    format: yaml
    fields:
      - name: signature
        label: Ton nom de plume
        type: string
      - name: logo_debut
        label: Logo, début (en blanc)
        type: string
      - name: logo_fin
        label: Logo, fin (dans la case rouge)
        type: string
      - name: slogan
        label: Slogan
        type: string
      - name: newsletter_lien
        label: Lien d'inscription à la newsletter
        type: string
        description: "Laisse vide tant que tu n'as pas de newsletter : le bloc reste caché."
      - name: instagram
        label: Lien Instagram
        type: string
      - name: x
        label: Lien X
        type: string
        description: "Laisse vide tant que tu n'as pas de compte X : le lien reste caché."
      - name: email_contact
        label: Adresse e-mail de contact
        type: string
        description: "Affichée en pied de page et sur la page À propos."
      - name: mention_independance
        label: Mention en pied de page
        type: text

  - name: epopee
    label: L'épopée
    type: file
    path: _data/epopee.yml
    format: yaml
    fields:
      - name: saison
        label: Saison
        type: string
      - name: chapitres
        label: Chapitres
        type: object
        list: true
        fields:
          - name: numero
            label: Numéro (I, II, III…)
            type: string
          - name: competition
            label: Compétition
            type: select
            options:
              values: [Ligue 1, Ligue des champions, Coupe de France, Trophée des champions, Match amical]
          - name: statut
            label: Où en est-on ?
            type: text

  - name: lexique
    label: Le lexique
    type: file
    path: _data/lexique.yml
    format: yaml
    fields:
      - name: mots
        label: Mots
        type: object
        list: true
        fields:
          - name: mot
            label: Mot
            type: string
          - name: definition
            label: Définition
            type: text
          - name: accueil
            label: "Afficher aussi sur l'accueil"
            type: boolean
            description: "Le lexique complet est sur la page /lexique/. Coche les quelques mots à montrer en page d'accueil."

  - name: tifos
    label: La galerie des tifos
    type: file
    path: _data/tifos.yml
    format: yaml
    fields:
      - name: tifos
        label: Tifos
        type: object
        list: true
        fields:
          - name: titre
            label: Titre du tifo
            type: string
          - name: affiche
            label: Texte affiché sans photo
            type: string
            description: "Deux ou trois mots en grand, montrés tant qu'il n'y a pas de photo. Ex. : 35 ans"
          - name: match
            label: Match
            type: string
            description: "Ex. : PSG 1-0 Troyes"
          - name: moment
            label: Moment
            type: string
            description: "Ex. : Avant-match, première période…"
          - name: photo
            label: Photo
            type: image
            description: "Ta photo, prise depuis le virage."
          - name: alt
            label: Description de la photo
            type: text
            description: "Ce qu'on voit sur la photo, en une ou deux phrases. Lue par les personnes malvoyantes et par Google."
          - name: description
            label: Ce qu'il représentait
            type: text

  - name: chants
    label: Les chants
    type: file
    path: _data/chants.yml
    format: yaml
    fields:
      - name: chants
        label: Chants
        type: object
        list: true
        fields:
          - name: nom
            label: Nom du chant
            type: string
          - name: air
            label: Sur l'air de
            type: string
            description: "La mélodie d'origine, si tu la connais. Sinon, laisse vide."
          - name: moment
            label: Quand le chante-t-on ?
            type: string
          - name: histoire
            label: Son histoire
            type: text
            description: "Raconte le chant avec tes mots. Ne recopie pas les paroles : elles sont protégées par le droit d'auteur."

  - name: jeu
    label: "Le jeu : Plus ou moins"
    type: file
    path: _data/plus_ou_moins.yml
    format: yaml
    fields:
      - name: parties
        label: Parties
        type: object
        list: true
        description: "Une partie = 10 duels. Le 10e est toujours le piège. Chaque partie s'ouvre sur le site à sa date de mise en ligne."
        fields:
          - name: date
            label: Date de mise en ligne
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: duels
            label: Les 10 duels (le dernier est le piège)
            type: object
            list: true
            fields:
              - name: categorie
                label: Catégorie
                type: select
                required: true
                options:
                  values: [Record du club, Record d'un joueur, Histoire, Identité du club, Économie, Fun fact]
              - name: question
                label: Question
                type: string
                required: true
                description: "Ex. : Qui a marqué le plus de buts avec Paris ?"
              - name: sens
                label: Qui gagne ?
                type: select
                required: true
                description: "« plus grand » : le plus grand nombre gagne. « plus petit » : le plus petit nombre, ou la date la plus ancienne, gagne."
                options:
                  values: [plus grand, plus petit]
              - name: unite
                label: Unité
                type: string
                description: "Affichée sous les chiffres. Ex. : buts, toutes compétitions"
              - name: a_nom
                label: "Choix de gauche : nom"
                type: string
                required: true
              - name: a_precision
                label: "Choix de gauche : précision"
                type: string
                description: "Ex. : 2013-2020, ou Ligue 1, octobre 2016"
              - name: a_valeur
                label: "Choix de gauche : valeur"
                type: string
                required: true
                description: "Un nombre (200, 836,1) ou une date au format AAAA-MM-JJ (1982-05-15). C'est elle qui décide du gagnant."
              - name: a_affiche
                label: "Choix de gauche : texte affiché (facultatif)"
                type: string
                description: "À la place de la valeur. Ex. : 6-0, mai 1982, ≈ 50"
              - name: b_nom
                label: "Choix de droite : nom"
                type: string
                required: true
              - name: b_precision
                label: "Choix de droite : précision"
                type: string
              - name: b_valeur
                label: "Choix de droite : valeur"
                type: string
                required: true
                description: "Un nombre ou une date au format AAAA-MM-JJ. Jamais la même que celle de gauche : il faut un gagnant."
              - name: b_affiche
                label: "Choix de droite : texte affiché (facultatif)"
                type: string
              - name: anecdote
                label: Anecdote
                type: text
                description: "Une ou deux phrases, montrées après la réponse."
              - name: source
                label: Source
                type: string
                description: "Ex. : Wikipédia, records du PSG"
              - name: lien
                label: Lien de la source
                type: string
                description: "L'adresse de la page, en https://"

  - name: pages
    label: Pages fixes
    type: collection
    path: pages
    format: yaml-frontmatter
    view:
      primary: title
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: permalink
        label: Adresse de la page
        type: string
        description: "Ex. : /a-propos/ — à ne pas modifier sur les pages existantes."
      - name: description
        label: Résumé pour Google et les partages
        type: text
        description: "Une phrase qui décrit la page. Facultatif."
      - name: body
        label: Texte
        type: rich-text
