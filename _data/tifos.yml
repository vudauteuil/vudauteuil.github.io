tifos:
  - titre: Les gladiateurs
    affiche: Gladiateurs
    match: PSG 2-2 AS Rome
    moment: Avant-match
    photo: /assets/images/tifo-gladiateurs-psg-rome.jpg
    alt: "Deux gladiateurs géants dressés dans le Virage Auteuil, au-dessus d'une mer de drapeaux bleus. À gauche, le gladiateur de Paris, debout, lance au poing et bouclier fleurdelisé. À droite, le gladiateur de Rome, incliné devant lui. Au fond, la pelouse du Parc des Princes, les flammes et les faisceaux de lumière de l'avant-match."
    description: >-
      Pour recevoir la Roma, Auteuil a sorti deux gladiateurs géants : celui
      de Paris debout, lance au poing et bouclier fleurdelisé, celui de Rome
      incliné devant lui. Sous leurs pieds, une mer de drapeaux, bleus en
      Auteuil Bleu, rouges en Auteuil Rouge.
  - titre: Les 35 ans du virage
    affiche: 35 ans
    match: PSG 1-0 Troyes
    moment: Première période
    photo: /assets/images/35ansAuteuil.jpg
    alt: "Le Virage Auteuil couvert par une voile géante pour les 35 ans de la tribune : un grand 35 gris taillé comme dans la pierre, entouré de lauriers et des dates 1991 et 2026, au milieu des torches et de la fumée orange. Au-dessus, la bannière « Fiers de nos couleurs »."
    description: >-
      Une voile géante sur tout le virage : un 35 monumental taillé comme dans
      la pierre, des rubans bleu, blanc, rouge et une couronne de torches pour
      allumer les bougies.

      Merci à ma source infiltrée dans Le Carré.
