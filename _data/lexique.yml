mots:
  - mot: "Tifo"
    definition: "L'animation visuelle déployée par la tribune : voiles, bâches, feuilles brandies, qui composent ensemble une image géante."
  - mot: "Voile"
    definition: "La toile géante tendue au-dessus des gradins, qui recouvre le virage le temps d'un tifo."
  - mot: "Craquage"
    definition: "L'allumage simultané de fumigènes ou de torches en tribune. Spectaculaire, mais interdit dans les stades français."
  - mot: "Capo"
    definition: "Le meneur, perché face à la tribune, mégaphone en main, qui lance les chants et donne le tempo."
  - mot: "Bâche"
    definition: "La banderole d'un groupe ou d'un message, accrochée aux grilles du virage."
  - mot: "Parcage"
    definition: "L'espace réservé aux supporters visiteurs, là où l'on se retrouve les soirs de déplacement."
