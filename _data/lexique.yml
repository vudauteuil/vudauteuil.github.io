mots:
  - mot: Auteuil Bleu
    definition: La partie haute du Virage Auteuil. Son nom vient de la couleur
      historique de ses sièges.
    accueil: false
  - mot: Auteuil Rouge
    definition: La partie basse du virage, au plus près de la pelouse. Son nom
      vient, lui aussi, de la couleur historique de ses sièges.
    accueil: false
  - mot: Bâche
    definition: La banderole d'un groupe ou d'un message, accrochée aux grilles du virage.
    accueil: true
  - mot: Capo
    definition: Le meneur, perché face à la tribune, mégaphone en main, qui lance
      les chants et donne le tempo.
    accueil: true
  - mot: Chambrage
    definition: L'art de taquiner l'adversaire, ses joueurs ou ses supporters, avec
      plus d'esprit que de méchanceté.
    accueil: false
  - mot: Cortège
    definition: La marche collective des supporters jusqu'au stade, derrière les
      bâches et les drapeaux, surtout les soirs de déplacement.
    accueil: false
  - mot: Craquage
    definition: L'allumage simultané de fumigènes ou de torches en tribune.
    accueil: true
  - mot: Déplacement
    definition: "Suivre l'équipe à l'extérieur. Des heures de route ou de train pour
      quatre-vingt-dix minutes de parcage : l'épreuve de vérité du supporter."
    accueil: false
  - mot: Deux-mâts
    definition: Une bannière tenue par deux hampes et brandie au-dessus des têtes.
      Plus maniable qu'une bâche, plus voyante qu'un drapeau.
    accueil: false
  - mot: Douzième homme
    definition: Le public, censé valoir un joueur de plus. Certains soirs, au Parc,
      il en vaut deux.
    accueil: false
  - mot: Drapeau
    definition: Agité tout le match, de la taille d'un mouchoir à celle d'un drap de
      lit. Les plus grands demandent des bras solides et des voisins
      compréhensifs.
    accueil: false
  - mot: Écharpe
    definition: L'accessoire de base, aux couleurs du club, tendue à bout de bras
      quand la tribune entonne les grands chants.
    accueil: false
  - mot: Fumigène
    definition: "Un pot qui dégage une épaisse fumée colorée. Comme la torche, il
      est interdit dans les stades : il expose le club à des sanctions et son
      auteur à des poursuites."
    accueil: false
  - mot: IDS
    definition: Interdiction de stade. Une mesure décidée par le préfet ou prononcée
      par un juge, qui empêche un supporter d'assister aux matchs, parfois avec
      l'obligation de pointer au commissariat les soirs de rencontre.
    accueil: false
  - mot: Kop
    definition: Une tribune populaire, debout et chantante. Le mot vient de la
      colline de Spion Kop, dont les supporters de Liverpool ont donné le nom à
      leur tribune. À Paris, il reste attaché à l'histoire de la tribune
      Boulogne.
    accueil: false
  - mot: Mégaphone
    definition: L'instrument du capo. Sans lui, impossible de lancer un chant en
      même temps d'un bout à l'autre du virage.
    accueil: false
  - mot: Mosaïque
    definition: Un tifo fait de cartons ou de feuilles de couleur levés au même
      instant par chaque spectateur. Vu du terrain, une image ; vu de sa place,
      un carré de papier et beaucoup d'espoir.
    accueil: false
  - mot: Parcage
    definition: L'espace réservé aux supporters visiteurs, là où l'on se retrouve
      les soirs de déplacement.
    accueil: true
  - mot: Poznań
    definition: Tout le monde dos au terrain, bras dessus bras dessous, et l'on
      saute en rythme. Le nom vient des supporters du Lech Poznań, en Pologne,
      qui l'ont rendu célèbre.
    accueil: false
  - mot: Tambour
    definition: Il donne le tempo quand la voix du capo ne suffit plus à couvrir le stade.
    accueil: false
  - mot: Tifo
    definition: "L'animation visuelle déployée par la tribune : voiles, bâches,
      feuilles brandies, qui composent ensemble une image géante."
    accueil: true
  - mot: Torche
    definition: Un feu à main qui brûle d'une flamme rouge vif. Spectaculaire, mais
      interdite dans les stades français.
    accueil: false
  - mot: Ultra
    definition: "Un supporter organisé en groupe, qui fait vivre la tribune pendant
      tout le match : chants, tifos, déplacements. Debout, toujours."
    accueil: false
  - mot: Virage
    definition: La tribune située derrière un but. Le nom vient des stades à piste,
      où ces tribunes suivaient la courbe de l'anneau. Au Parc, le Virage
      Auteuil fait face à la tribune Boulogne.
    accueil: false
  - mot: Voile
    definition: La toile géante tendue au-dessus des gradins, qui recouvre le virage
      le temps d'un tifo.
    accueil: true
