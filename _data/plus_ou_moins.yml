# Le jeu « Plus ou moins » : les parties et leurs duels.
# Se modifie dans Pages CMS, menu « Le jeu ».
#
# Une partie = 10 duels. Le 10e est toujours le piège de la partie.
# La partie s'affiche sur le site à partir de sa date de mise en ligne.
#
# Pour chaque duel :
#   sens : « plus grand » (le plus grand nombre gagne)
#          ou « plus petit » (le plus petit nombre, ou la date la plus ancienne, gagne)
#   a_valeur / b_valeur : le nombre comparé (ex. 200, 836,1) ou une date (AAAA-MM-JJ)
#   a_affiche / b_affiche : facultatif, ce qui s'affiche à la place (ex. « 6-0 », « mai 1982 »)

