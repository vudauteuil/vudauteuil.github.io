chants:
  - nom: Tous ensemble on chantera
    air: Vuoto a perdere de Noemi
    moment: Les grands soirs, et surtout pour fêter une victoire.
    histoire: "Né en tribune Auteuil vers 2016, il est devenu l'hymne officieux du
      club. "
  - nom: Ô Ville Lumière
    air: Flower of Scotland, l'hymne écossais
    moment: Généralement en fin de première mi-temps ou lorsqu'il y a une raison qui
      dépasse le match
    histoire: Repris par les ultras parisiens dans les années 90.
  - nom: Chanson capitale
    air: Milord d'Edith Piaf
    moment: Pour unir le Virage Auteuil
    histoire: Un classique du virage... intergénérationnel
  - nom: Paris dans la peau
    histoire: Un chant d'identité, celui des ultras que Paris rend fous et qui font
      résonner leur passion depuis le virage. Il finit en relance, sur des «
      Allez » repris par toute la tribune.
  - nom: Paris est magique
    moment: En échange entre les tribunes Auteuil et Boulogne.
    histoire: "Plus un cri qu'une chanson : les deux virages du Parc se renvoient la
      phrase, puis se saluent l'un l'autre. Avec « Ici c'est Paris », c'est
      l'une des devises les plus célèbres du club. Le retour des ultras à
      Boulogne, en 2025, lui a rendu tout son sens."
  - nom: Pour toi PSG
    air: Por que te vas de Jeannette
    histoire: "Un serment de fidélité totale : pour le club, le virage est prêt à
      tout donner."
  - nom: Où tu es nous sommes là
    histoire: "La promesse de suivre Paris partout et pour toujours : où que joue
      l'équipe, le virage sera là, et elle ne sera jamais seule."
  - nom: Allez Paris !
    histoire: Un cri d'encouragement tout simple, pour pousser l'équipe.
  - nom: Fidèles à nos couleurs
    moment: Dans les moments difficiles, et à l'extérieur.
    histoire: La fierté des Parisiens réunis, loyaux aux couleurs du club quoi qu'il
      arrive. D'après un ancien répertoire du virage, un chant de ce nom a été
      inventé par les Rangers, un groupe de Boulogne qui chantait à l'anglaise,
      écharpes au vent.
  - nom: Victoire du PSG
    moment: Quand la victoire se dessine, ou pour la fêter.
    histoire: Un très vieux chant du Parc, qui annonce la victoire du soir et se
      termine par un « Ça c'est Paris ! ». Il ressort de temps en temps des
      archives du virage.
  - nom: Raí
    air: Capitaine Flamme
    histoire: Un hommage à Raí, capitaine brésilien du PSG de 1993 à 1998 et symbole
      du club des années 90, que le chant sacre plus grand des Parisiens.
  - nom: La chanson du PSG
    histoire: "Un chant à répons entre tribunes : on y clame la fierté d'être du
      PSG, on y chambre le rival marseillais, puis on annonce les buts à venir."
  - nom: Jusqu'à la mort
    histoire: "Le serment de chanter pour Paris toute une vie, dans les épreuves
      comme dans les succès : le club reste gravé dans la tête du supporter."
  - nom: Debout sur la tribune
    histoire: Un appel à se lever et à chanter tous ensemble pour porter l'équipe.
  - nom: En rouge et bleu
    histoire: "Un chant d'unité : réunis par la même passion, les supporters se
      disent invincibles et le virage fait monter le rouge et bleu."
  - nom: Fier du PSG
    air: If you're happy and you know it clap your hands
    histoire: Un chant rythmé, ponctué de cris et de claquements de mains, pour
      affirmer la fierté d'être parisien.
  - nom: Allez Paris S-G
    histoire: Un cri d'encouragement répété en boucle, au nom du club.
  - nom: Écoutez chanter !
    histoire: Les Parisiens y vantent la puissance de leur voix et invitent
      l'adversaire à se taire.
  - nom: Hymne PSG
    air: Go West des Village People
    histoire: "Le nom du club scandé, mains qui claquent. Le refrain « Allez
      Paris-Saint-Germain » vient de l'hymne enregistré en 1977 par Les
      Parisiens, à l'initiative de Charles Talar, et il est vite devenu un chant
      de tribune. Une nouvelle version, sur l'air de « Go West », a été
      enregistrée en 2010 pour les 40 ans du club : c'est l'hymne officiel
      actuel."
