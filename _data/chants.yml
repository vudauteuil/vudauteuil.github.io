chants:
  - nom: Tous ensemble on chantera
    air: Vuoto a perdere de Noemi
    moment: Les grands soirs, et surtout pour fêter une victoire.
    histoire: "Né en tribune Auteuil vers 2016, il est devenu l'hymne officieux du
      club. "
  - nom: Ô Ville Lumière
    air: Flower of Scotland, l'hymne écossais
